name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ---------------------------------------------------------------------------
  # Linux — GCC + system SDL2
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libgtk-3-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows — MSVC x64 + vcpkg static SDL2 (mirrors the release build)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build & Test (Windows MSVC x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL2 (static) via vcpkg
        run: vcpkg install sdl2:x64-windows-static
        shell: pwsh

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure
