name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Linux — build + package as AppImage
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libgtk-3-dev pkg-config

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install into AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          # AppImages need FUSE; extract instead to work in GitHub Actions
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          echo "${{ github.workspace }}/squashfs-root/usr/bin" >> $GITHUB_PATH

      - name: Create AppImage
        env:
          OUTPUT: emu-${{ github.ref_name }}-linux-x86_64.AppImage
          VERSION: ${{ github.ref_name }}
        run: |
          squashfs-root/AppRun \
            --appdir AppDir \
            --desktop-file assets/emu.desktop \
            --icon-file assets/icon.png \
            --output appimage

          # linuxdeploy names the output based on .desktop Name + version
          mv emu-*.AppImage "$OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: emu-${{ github.ref_name }}-linux-x86_64.AppImage

  # ---------------------------------------------------------------------------
  # Windows — build + bundle DLLs via ntldd + zip
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Zip
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ntldd-git
            zip

      - name: Configure (Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Bundle DLLs with ntldd
        run: |
          mkdir -p dist
          cp build/emu.exe dist/

          # Walk all recursive DLL dependencies; keep only those inside MinGW
          ntldd -R dist/emu.exe \
            | grep -i '/mingw64/' \
            | awk '{print $3}' \
            | sort -u \
            | xargs -I{} cp {} dist/

      - name: Create zip
        run: |
          VERSION="${{ github.ref_name }}"
          cd dist
          zip -r "../emu-${VERSION}-windows-x64.zip" .

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: emu-${{ github.ref_name }}-windows-x64.zip

  # ---------------------------------------------------------------------------
  # Create GitHub Release and attach both artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" \
            --title "emu ${VERSION}" \
            --generate-notes \
            --prerelease \
            artifacts/linux-appimage/emu-${VERSION}-linux-x86_64.AppImage \
            artifacts/windows-zip/emu-${VERSION}-windows-x64.zip
